<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAX method</title>
<link rel="stylesheet" href="interactive.css">
<style>
@font-face{font-family:SourceSans;src:url('../fonts/SourceSans3-Regular.woff2');font-weight:400;font-display:swap}
@font-face{font-family:SourceSans;src:url('../fonts/SourceSans3-Semibold.woff2');font-weight:600;font-display:swap}
:root{--bg:#fff;--ink:#152b3c;--head:#152b3c;--muted:#637382;--surface:#fff;--sunk:#f4f6f8;--ink-2:#435667;--line:#d9e1e7;--grid:#eef2f4;--rax:#2c7195;--rax-soft:#e5f1f5;--base:#bac8d1;--base-ink:#637382;--code:#6250b6;--code-soft:#eeebf8;--new:#0e8a5f;--warn:#c93c35;--amber:#aa7800;--font:SourceSans,Arial,sans-serif;--sans:var(--font);--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;background:#fff;width:100%;height:100%;overflow:hidden;font-family:var(--font)}button{font-family:var(--font)}button:focus-visible{outline:3px solid #6c96bd;outline-offset:3px}[hidden]{display:none!important}p,h3,pre,ol{margin:0;padding:0}.stage{position:absolute;width:1448px;height:570px;transform-origin:top left}.bx .card.how2{height:570px;border:0;border-radius:0;background:#fff}.bx .acts{height:66px;grid-template-columns:repeat(5,minmax(0,1fr));padding:0 42px 0 0;border-bottom:1px solid var(--line)}.bx .acts button{height:65px;padding:10px 12px;gap:9px}.bx .acts button strong{font-size:19px;font-weight:600;line-height:1.15;letter-spacing:0}.bx .acts button em{font-size:15px;line-height:1.2;margin-top:4px}.bx .acts button b{font-size:17px;font-weight:600;width:27px;height:27px}.bx .how2 .cc{height:504px;grid-template-columns:640px minmax(0,1fr);gap:24px;overflow:hidden}.bx .how-dia{width:638px;height:500px;aspect-ratio:auto;margin:4px 0 0}.bx .how2 .cc-side{padding:16px 0 5px;gap:12px;overflow:hidden}.bx .pl-now .k{font-size:15px;font-weight:400;color:var(--muted);margin-bottom:4px}.bx .pl-now h3{font-size:27px;font-weight:600;margin:0 0 7px;line-height:1.12}.bx .pl-now p{font-size:18px;line-height:1.35}.bx .pl-now .how-stat{font-size:17px;font-weight:600;margin-top:9px;padding-left:10px}.bx .how2 .cc-side .cc-code{border-radius:4px;min-height:190px}.bx .how2 .cc-side .cc-code-head{font-size:13px;padding:7px 12px;font-weight:500}.bx .how2 .cc-feed,.bx .how2 .cc-pre{font-size:13px;line-height:1.55}.bx .how2 .cc-feed .fl{grid-template-columns:8.5ch 5.5ch 1fr;gap:8px;padding:3px 12px}.bx .cc-feed .kd{font-size:12px;font-weight:600}.bx .p3-chip b,.bx .p3-chip span{font-size:12px}.bx .pl-tag{font-size:13px}.bx .pl-btn{width:32px;height:32px}.bx .pl-btn svg{width:14px;height:14px}.bx .p3-lbl{font-size:12px}.bx .hw-title{font-weight:600}.replay{position:absolute;right:0;top:15px;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--blue,#2c5d98);font-size:24px;cursor:pointer;line-height:1}.bx .how-svg text{font-family:var(--sans)}.bx .how-svg .hw-mono{font-family:var(--mono)!important}
</style></head><body><main class="stage bx"><div class="card how2" id="howRoot"><ol class="acts" aria-label="Five stages"></ol><button class="replay" type="button" aria-label="Replay current stage" title="Replay current stage">↻</button><div class="cc"><div class="how-dia"><svg class="how-svg" role="img" aria-label="Coding agent, memory, program, and robot; active connections animate with the session"></svg><div class="pl-media"><video muted playsinline preload="auto" aria-label="Air-fryer session"></video><span class="pl-tag"></span><div class="pl-progress"><span></span></div><button type="button" class="pl-btn" aria-label="Pause"><svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button></div></div><div class="cc-side"><div class="pl-now" aria-live="polite"><div class="k how-k"></div><h3 class="how-h"></h3><p class="how-p"></p><p class="how-stat"></p></div><div class="cc-code"><div class="cc-code-head"></div><pre class="cc-pre"></pre><div class="cc-feed" hidden></div></div></div></div></div></main>
<script>function fit(){const s=Math.min(innerWidth/1448,innerHeight/570);const el=document.querySelector('.stage');el.style.transform='scale('+s+')';el.style.left=Math.max(0,(innerWidth-1448*s)/2)+'px';el.style.top=Math.max(0,(innerHeight-570*s)/2)+'px';}addEventListener('resize',fit);fit();</script>
<script src="three.min.js"></script><script src="program.js"></script><script src="perceive-data.js"></script><script src="how.js"></script><script src="perceive3d.js"></script></body></html>
